name: CI

# main / develop 宛の PR と、それらへの push で実行する。
# 本番ビルド（next build）は環境変数が必要なため Vercel 側に任せ、
# ここでは環境変数なしで動く lint と型チェックだけを回す。
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      # 地域データは Web と Mobile で実体を複製している（別 npm プロジェクトのため）。
      # 片方だけ更新されると同じ座標が別エリアとして集計されるので、ここで止める。
      - name: Region data in sync
        run: npm run check:regions

      # 移行SQLは SQL Editor に人が貼って実行するので、
      # 構文エラーは本番で初めて分かる。PostgreSQL 本物のパーサに
      # 通して、貼る前に落とす（実行はしないので副作用は無い）。
      - name: SQL syntax
        run: npm run check:sql

      # デモ投稿の prefecture / area は手書き。エリアデータを増やすと
      # 座標からの判定が変わり、既存のデモが静かに壊れる
      # （225→307件に増やしたとき実際に起きた）。投入前に気づく。
      - name: Seed data consistency
        run: npm run check:seed

  # モバイル（Expo）は独立した npm プロジェクト。
  # ネイティブビルドは EAS 側に任せ、ここでは型チェックのみ回す。
  mobile:
    name: mobile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      # 型チェックは Babel も Metro も通らないため、バンドルできない状態を
      # 検出できない。実際 babel-preset-expo が devDependencies から抜けていて、
      # CI は緑のまま「実機で起動すると必ず落ちる」状態が続いていた。
      # ここで一度バンドルまで通し、同じ抜けが再発したら止める。
      - name: Bundle (Metro)
        run: npx expo export --platform ios --output-dir /tmp/expo-export
