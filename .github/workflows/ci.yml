name: CI

# main / develop 宛の PR と、それらへの push で実行する。
# 本番ビルド（next build）は環境変数が必要なため Vercel 側に任せ、
# ここでは環境変数なしで動く lint と型チェックだけを回す。
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ★ Node 24。テストが .ts をそのまま import している
      #   （scripts/test-moderation.mjs / test-review-cases.mjs）。
      #   写しではなく本物の実装を呼ぶための作りなので、
      #   型を剥がせる版が要る。22 に戻すとテストが読み込めない。
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      # 地域データは Web と Mobile で実体を複製している（別 npm プロジェクトのため）。
      # 片方だけ更新されると同じ座標が別エリアとして集計されるので、ここで止める。
      - name: Region data in sync
        run: npm run check:regions

      # 移行SQLは SQL Editor に人が貼って実行するので、
      # 構文エラーは本番で初めて分かる。PostgreSQL 本物のパーサに
      # 通して、貼る前に落とす（実行はしないので副作用は無い）。
      - name: SQL syntax
        run: npm run check:sql

      # デモ投稿の prefecture / area は手書き。エリアデータを増やすと
      # 座標からの判定が変わり、既存のデモが静かに壊れる
      # （225→307件に増やしたとき実際に起きた）。投入前に気づく。
      - name: Seed data consistency
        run: npm run check:seed

      # 禁止語は端末側とDB側に二重に持っている。食い違うと
      # 「端末では弾かれるのにDBは通す」（またはその逆）になり、
      # 前者は素通しの穴、後者は原因の分からない保存失敗になる。
      - name: Moderation lists in sync
        run: npm run check:moderation

      # 禁止語フィルタの本体。大事なのは「弾く」より「通す」ほうで、
      # 「バカうまい」「デブ活」「シャブシャブ」を巻き添えにすると
      # アプリが使えなくなる。語を足したら必ずここを通す。
      - name: Moderation behaviour
        run: npm run test:moderation

      # 2026-08-29 の監査で直したバグの再現テスト。
      # 直したはずのものが戻っていないかを見る（OPEN は未対応の既知バグ）。
      - name: Review regressions
        run: npm run test:review

  # モバイル（Expo）は独立した npm プロジェクト。
  # ネイティブビルドは EAS 側に任せ、ここでは型チェックのみ回す。
  mobile:
    name: mobile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      # ★ mobile/ は長らく lint されていなかった。
      #   ルートの eslint.config.mjs が mobile/** を除外していて、
      #   mobile 側には設定ファイルが無かったため、どちらからも漏れていた。
      #   そのせいで「早期リターンより後ろで useCallback を呼ぶ」という
      #   Rules of Hooks 違反が素通りし、プロフィールを開くと必ず落ちる
      #   ビルドを App Store Connect まで上げてしまった（v1.0.2）。
      #   型チェックもバンドルもこれを捕まえられない。lint だけが捕まえる。
      - name: Lint
        run: npm run lint

      # ★ 画面を実際に描くテスト。
      #   型チェックも lint も「開いたら落ちる」は捕まえられない。
      #   ここでは本物の React で画面を組み立てて、読み込み中 →
      #   読み込み完了 まで通す。v1.0.2 のクラッシュは完了した回だけ
      #   フックが増えて起きたので、その両方を通さないと再現しない。
      #
      #   ★ このジョブに置くこと。テストは mobile/ にあり、
      #     jest も mobile/package.json にしかない。
      #     ルートの build ジョブに置くと、ルートには test スクリプトが
      #     無いので「Missing script: test」で必ず落ちる（実際落ちた）。
      - name: Render tests
        run: npm test

      # 型チェックは Babel も Metro も通らないため、バンドルできない状態を
      # 検出できない。実際 babel-preset-expo が devDependencies から抜けていて、
      # CI は緑のまま「実機で起動すると必ず落ちる」状態が続いていた。
      # ここで一度バンドルまで通し、同じ抜けが再発したら止める。
      - name: Bundle (Metro)
        run: npx expo export --platform ios --output-dir /tmp/expo-export

      # 使っていない権限（マイク・常時位置情報・Face ID）は、
      # 指定を省くとプラグインの既定値として英語の文言つきで勝手に入る。
      # 常時位置情報は審査で厳しく見られ、プライバシー表示とも食い違う。
      # プラグイン更新で再発するので毎回見る。
      - name: iOS native config
        run: npm run check:ios
