  #   defaults:
  #     run:
  #       working-directory: mobile
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-node@v4
  #       with:
  #         node-version: 22
  #         cache: npm
  #         cache-dependency-path: mobile/package-lock.json
